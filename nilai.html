<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Nilai - Cubicubi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: bgMove 10s ease infinite;
        }

        @keyframes bgMove {
            0% {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            }
            50% {
                background: linear-gradient(135deg, #764ba2 0%, #f093fb 100%);
            }
            100% {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 40px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.8s ease-out;
            backdrop-filter: blur(10px);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
            animation: fadeIn 1.5s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .card:hover {
            transform: translateX(10px) scale(1.02);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .card.owner {
            border-left: 5px solid #ff6b6b;
            animation: slideInLeft 0.5s ease-out;
        }

        .card.kolab1 {
            border-left: 5px solid #4ecdc4;
            animation: slideInLeft 0.7s ease-out;
        }

        .card.kolab2 {
            border-left: 5px solid #ffe66d;
            animation: slideInLeft 0.9s ease-out;
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .role {
            font-size: 0.9em;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .name {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
            margin-top: 5px;
        }

        .badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8em;
            margin-top: 10px;
        }

        .btn-back {
            display: block;
            text-align: center;
            margin-top: 30px;
            padding: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: all 0.3s;
            animation: pulse 2s infinite;
        }

        .btn-back:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(102, 126, 234, 0.7);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(102, 126, 234, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(102, 126, 234, 0);
            }
        }

        .nilai-box {
            margin-top: 20px;
            text-align: center;
            animation: fadeInUp 1s;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .score {
            font-size: 2em;
            font-weight: bold;
            color: #764ba2;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            color: #888;
            font-size: 0.8em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ DAFTAR NILAI ✨</h1>

        <div class="card owner">
            <div class="role">👑 OWNER / KETUA TIM</div>
            <div class="name">Izzah Syahar Tanazila</div>
            <div class="badge">Nilai: 95 ⭐</div>
        </div>

        <div class="card kolab1">
            <div class="role">💻 KOLABORATOR 1</div>
            <div class="name">Natasha Mira Aulia</div>
            <div class="badge">Nilai: 92 ⭐</div>
        </div>

        <div class="card kolab2">
            <div class="role">🎨 KOLABORATOR 2</div>
            <div class="name">Rana Kusuma</div>
            <div class="badge">Nilai: 90 ⭐</div>
        </div>

        <div class="nilai-box">
            <p>📊 Rata-rata Nilai Tim</p>
            <div class="score">92.3</div>
        </div>

        <a href="beranda.html" class="btn-back">🏠 Kembali ke Beranda</a>
        
        <footer>
            <p>© 2024 - Cubicubi Team</p>
        </footer>
    </div>
</body>
</html>
